    <clipPath id="panel"><rect width="960" height="248" rx="12"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .sapphire-glint { animation: glint 6.2s ease-in-out infinite; }
      .plot-window { transform-origin: 417px 0; animation: fill-plot 6.2s linear infinite; }
      .wash { animation: fade-plot 6.2s linear infinite; }
      .echo { animation: echo 6.2s ease-out infinite; }
      .seconds { animation: seconds 60s steps(300,end) infinite; }
      .trace { animation: trace 6.2s linear infinite; }
      .cursor { animation: follow 6.2s linear infinite; }
      .bell { transform-origin: 0 -14px; animation: ring 6.2s ease-in-out infinite; }
      .waves { animation: sound 6.2s ease-out infinite; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .balance {animation: rock 1.5s ease-in-out infinite;}
      .detected {animation: confirm 6.2s ease-out infinite;}
      .sweep-light {animation: scan 6.2s linear infinite;}
    }
    @keyframes rock {0%,100% {transform:rotate(-37deg)} 50% {transform:rotate(37deg)}}
    @keyframes confirm {0%,59%,100% {opacity:.2} 68%,83% {opacity:1}}
    @keyframes scan {0%,8% {transform:translateX(0);opacity:0} 12% {opacity:.74} 29.8%,35.6% {transform:translateX(163px)} 49.8%,55.6% {transform:translateX(269px)} 67%,84% {transform:translateX(354px);opacity:.74} 97%,100% {transform:translateX(354px);opacity:0}}
    @keyframes glint {
      0%,8% { transform: translateX(-148px); opacity: 0; }
      23% { opacity: .82; } 49%,100% { transform: translateX(148px); opacity: 0; }
    }
    @keyframes fill-plot {
      0%,8% { transform: scaleX(0); } 29.8%,35.6% { transform: scaleX(.46045); }
      49.8%,55.6% { transform: scaleX(.75989); } 67%,100% { transform: scaleX(1); }
    }
    @keyframes fade-plot { 0%,86% { opacity: 1; } 97%,100% { opacity: 0; } }
    @keyframes echo {
      0%,64% { transform: scale(.91); opacity: 0; } 67% { opacity: .68; }
      88%,100% { transform: scale(1.68); opacity: 0; }
    }
    @keyframes seconds { from { transform: rotate(36deg); } to { transform: rotate(396deg); } }
    @keyframes trace { 0%,8% { stroke-dashoffset: 100; opacity: 1; } 67%,86% { stroke-dashoffset: 0; opacity: 1; } 97%,100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes follow {
      0%,8% { transform: translate(417px,153px); opacity: 0; }
      12% { opacity: 1; } 29.8% { transform: translate(580px,153px); } 35.6% { transform: translate(580px,109px); }
      49.8% { transform: translate(686px,109px); } 55.6% { transform: translate(686px,65px); }
      67%,86% { transform: translate(771px,65px); opacity: 1; } 97%,100% { transform: translate(771px,65px); opacity: 0; }
    }
    @keyframes ring { 0%,64%,84%,100% { transform: rotate(0); } 67% { transform: rotate(15deg); } 71% { transform: rotate(-12deg); } 75% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } }
    @keyframes sound { 0%,64%,95%,100% { opacity: 0; } 69%,78% { opacity: 1; } }
  </style>
