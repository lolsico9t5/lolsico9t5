<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">HMT Restock Radar</title>
  <desc id="desc">A mechanical watch ticks as a stock trace rises and rings a notification bell.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1=".8" x2="1" y2=".15"><stop stop-color="#d5ccba"/><stop offset=".43" stop-color="#eae2d3"/><stop offset="1" stop-color="#f6f1e7"/></linearGradient>
    <linearGradient id="steel" x1=".03" y1=".12" x2=".94" y2=".86"><stop stop-color="#e3dfce"/><stop offset=".14" stop-color="#fcf8e6"/><stop offset=".27" stop-color="#87867a"/><stop offset=".47" stop-color="#c8c6b6"/><stop offset=".58" stop-color="#f8f2dc"/><stop offset=".78" stop-color="#77776e"/><stop offset=".94" stop-color="#dfd9c5"/><stop offset="1" stop-color="#999a8b"/></linearGradient>
    <linearGradient id="band"><stop stop-color="#343c31"/><stop offset=".12" stop-color="#535b49"/><stop offset=".48" stop-color="#606654"/><stop offset=".87" stop-color="#4e5748"/><stop offset="1" stop-color="#303a30"/></linearGradient>
    <radialGradient id="dial" cx=".42" cy=".33" r=".75"><stop stop-color="#fff9e9"/><stop offset=".74" stop-color="#eee7d2"/><stop offset="1" stop-color="#d0c8b1"/></radialGradient>
    <filter id="shade" x="-45%" y="-35%" width="200%" height="190%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="panel"><rect width="960" height="224" rx="6"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .seconds { animation: seconds 60s steps(300,end) infinite; }
      .trace { animation: trace 7.5s linear infinite; }
      .cursor { animation: follow 7.5s linear infinite; }
      .bell { transform-origin: 0 -14px; animation: ring 7.5s ease-in-out infinite; }
      .waves { animation: sound 7.5s ease-out infinite; }
    }
    @keyframes seconds { from { transform: rotate(36deg); } to { transform: rotate(396deg); } }
    @keyframes trace { 0%,8% { stroke-dashoffset: 100; opacity: 1; } 67%,86% { stroke-dashoffset: 0; opacity: 1; } 97%,100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes follow {
      0%,8% { transform: translate(417px,153px); opacity: 0; }
      12% { opacity: 1; } 29.8% { transform: translate(580px,153px); } 35.6% { transform: translate(580px,109px); }
      49.8% { transform: translate(686px,109px); } 55.6% { transform: translate(686px,65px); }
      67%,86% { transform: translate(771px,65px); opacity: 1; } 97%,100% { transform: translate(771px,65px); opacity: 0; }
    }
    @keyframes ring { 0%,64%,84%,100% { transform: rotate(0); } 67% { transform: rotate(15deg); } 71% { transform: rotate(-12deg); } 75% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } }
    @keyframes sound { 0%,64%,95%,100% { opacity: 0; } 69%,78% { opacity: 1; } }
  </style>
