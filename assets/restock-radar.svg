<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title desc">
  <title id="title">HMT Restock Radar</title>
  <desc id="desc">A mechanical watch ticks as a stock trace rises and rings a notification bell.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1=".8" x2="1" y2=".15"><stop stop-color="#d4c3ab"/><stop offset=".43" stop-color="#f2e2ca"/><stop offset="1" stop-color="#fff5e7"/></linearGradient>
    <linearGradient id="case-field" x1=".05" y1="0" x2=".94" y2=".84"><stop stop-color="#15273d"/><stop offset=".57" stop-color="#1b4651"/><stop offset="1" stop-color="#122939"/></linearGradient>
    <radialGradient id="dial-light" cx=".32" cy=".18" r=".92"><stop stop-color="#40888c"/><stop offset=".56" stop-color="#1d616b"/><stop offset="1" stop-color="#103647"/></radialGradient>
    <linearGradient id="graph" x2="1" y2=".15"><stop stop-color="#bdbdad"/><stop offset=".4" stop-color="#e0decb"/><stop offset="1" stop-color="#f6ecd7"/></linearGradient>
    <linearGradient id="brass"><stop stop-color="#9d745f"/><stop offset=".31" stop-color="#efd6a9"/><stop offset=".54" stop-color="#b69b79"/><stop offset="1" stop-color="#f3c9a1"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 22V0h22" fill="none" stroke="#6b8a81" stroke-width=".65" opacity=".39"/><circle cx="1" cy="1" r=".75" fill="#789288" opacity=".5"/></pattern>
    <pattern id="knurl" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(44)"><path d="M0 0v5" stroke="#b8e3d5" opacity=".24" stroke-width="1.3"/></pattern>
    <g id="lug"><circle r="3" fill="#929b8f"/><path d="M-1.4 1.4l2.8-2.8" stroke="#e6e3d0" stroke-width="1"/></g>
    <linearGradient id="steel" x1=".03" y1=".12" x2=".94" y2=".86"><stop stop-color="#e3dfce"/><stop offset=".14" stop-color="#fcf8e6"/><stop offset=".27" stop-color="#87867a"/><stop offset=".47" stop-color="#c8c6b6"/><stop offset=".58" stop-color="#f8f2dc"/><stop offset=".78" stop-color="#77776e"/><stop offset=".94" stop-color="#dfd9c5"/><stop offset="1" stop-color="#999a8b"/></linearGradient>
    <linearGradient id="band"><stop stop-color="#193c46"/><stop offset=".12" stop-color="#315566"/><stop offset=".48" stop-color="#416e7a"/><stop offset=".87" stop-color="#2c5664"/><stop offset="1" stop-color="#173641"/></linearGradient>
    <filter id="shade" x="-45%" y="-35%" width="200%" height="190%"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="chart-wash" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#179991" stop-opacity=".42"/><stop offset="1" stop-color="#58c5b2" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="reflection"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".52" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#d5fff8" stop-opacity="0"/></linearGradient>
