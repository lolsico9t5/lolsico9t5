<svg xmlns="http://www.w3.org/2000/svg" width="500" height="178" viewBox="0 0 500 178" role="img" aria-label="n8n, Gmail, Ollama, Llama 3, Notion An n8n workflow that turns Gmail snippets into a prioritized inbox in Notion. Llama 3 runs locally via Ollama to summarize and categorize each snippet. The workflow checks for a summary, category, and priority and attempts one repair if a parsed response is missing a required field.">
