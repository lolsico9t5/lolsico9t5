<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">AI Email Intelligence System</title>
  <desc id="desc">A message leaves Gmail, passes through Ollama, and settles into a prioritized list in Notion.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1=".5" x2="1" y2=".58"><stop stop-color="#142626"/><stop offset=".54" stop-color="#1d3433"/><stop offset="1" stop-color="#172827"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f4ebd8"/><stop offset="1" stop-color="#c3b99e"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".83" y2="1"><stop stop-color="#d6c7a4"/><stop offset=".35" stop-color="#a79c7e"/><stop offset="1" stop-color="#6d7564"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334b44"/><stop offset="1" stop-color="#223731"/></linearGradient>
    <g id="pin-bank" fill="none" stroke="#b5a582" stroke-width="3.4" stroke-linecap="round">
      <path d="M-29 -43v-7m10 7v-7m10 7v-7m10 7v-7m10 7v-7m10 7v-7m10 7v-7"/>
    </g>
    <g id="card">
      <rect x="-60" y="-34" width="120" height="68" rx="4" fill="url(#paper)" stroke="#fcf3dc" stroke-width="1.1"/>
      <path d="M-58 30l38 -29m78 29l-38 -29" fill="none" stroke="#b5ab91" stroke-width="1.45"/>
      <path d="M-58 -30L-4 6q4 3 8 0l54 -36" fill="none" stroke="#756e59" stroke-width="1.8"/>
    </g>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .message { animation: lift 6.8s ease-in-out infinite; }
      .input { animation: in-packet 6.8s ease-in-out infinite; }
      .output { animation: out-packet 6.8s ease-in-out infinite; }
      .core { animation: process 6.8s ease-in-out infinite; }
      .bar { animation: read 6.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
      .b2 { animation-delay: .13s; } .b3 { animation-delay: .25s; }
      .priority { animation: sort 6.8s cubic-bezier(.32,.02,.24,.99) infinite; }
      .row { animation: shift 6.8s cubic-bezier(.32,.02,.24,.99) infinite; }
    }
    @keyframes lift { 0%,4%,30%,100% { transform: translate(0,0); } 12%,19% { transform: translate(4px,-6px); } }
    @keyframes in-packet {
      0%,12% { transform: translate(245px,98px); opacity: 0; } 14% { opacity: 1; }
      34% { transform: translate(407px,98px); opacity: 1; } 36%,100% { transform: translate(407px,98px); opacity: 0; }
    }
    @keyframes process { 0%,30%,61%,100% { opacity: .28; } 39%,52% { opacity: 1; } }
    @keyframes read { 0%,32%,60%,100% { transform: scaleX(1); } 39% { transform: scaleX(.4); } 48% { transform: scaleX(.95); } }
    @keyframes out-packet {
      0%,52% { transform: translate(525px,98px); opacity: 0; } 54% { opacity: 1; }
      71% { transform: translate(685px,98px); opacity: 1; } 73%,100% { transform: translate(685px,98px); opacity: 0; }
    }
    @keyframes sort {
      0%,66% { transform: translateY(42px); } 77%,94% { transform: translateY(0); }
      100% { transform: translateY(42px); }
    }
    @keyframes shift {
      0%,66% { transform: translateY(-22px); } 77%,94% { transform: translateY(0); }
      100% { transform: translateY(-22px); }
    }
  </style>
  <rect width="960" height="224" rx="6" fill="url(#field)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M241 98H418m97 0h174" stroke="#738a79" stroke-width="1.5"/>
    <path d="M276 107h52l9 7h46m161 -30h40l10 6h49" stroke="#567166" stroke-width="1"/>
    <path d="M289 90h20m312 15h22" stroke="#839181" stroke-width="1"/>
    <g stroke="#b9ab87" stroke-width="1.2"><path d="M403 94l5 4 -5 4m277 -8l5 4 -5 4"/></g>
  </g>
  <g transform="translate(170 98)">
    <rect x="-62" y="-30" width="120" height="68" rx="4" transform="rotate(-10)" fill="#54695d" stroke="#8a9783"/>
    <rect x="-61" y="-30" width="120" height="68" rx="4" transform="rotate(-4)" fill="#83927d" stroke="#adba9e"/>
    <g transform="rotate(3)"><g class="message"><use href="#card"/></g></g>
  </g>
  <g transform="translate(466 98)">
    <use href="#pin-bank"/><use href="#pin-bank" transform="rotate(90)"/><use href="#pin-bank" transform="rotate(180)"/><use href="#pin-bank" transform="rotate(270)"/>
    <rect x="-41" y="-39" width="87" height="87" rx="7" fill="#0a1c19" opacity=".7"/>
    <rect x="-43" y="-43" width="86" height="86" rx="7" fill="url(#metal)" stroke="#cabe9f" stroke-width="1.3"/>
    <rect x="-36" y="-36" width="72" height="72" rx="4" fill="url(#board)" stroke="#384b40" stroke-width="1.2"/>
    <rect class="core" x="-32" y="-32" width="64" height="64" rx="2.5" fill="none" stroke="#c9b990" opacity=".62"/>
    <g fill="#d8c9a5">
      <rect class="bar" x="-15" y="-11" width="31" height="3.2" rx="1"/>
      <rect class="bar b2" x="-15" y="-1.5" width="23" height="3.2" rx="1"/>
      <rect class="bar b3" x="-15" y="8" width="28" height="3.2" rx="1"/>
    </g>
    <circle cx="-29" cy="28" r="1.5" fill="#9cae91"/>
  </g>
  <g transform="translate(768 98)">
    <rect x="-73" y="-49" width="151" height="103" rx="5" fill="#0d211d"/>
    <rect x="-76" y="-52" width="152" height="104" rx="5" fill="#2e443d" stroke="#8e9a84" stroke-width="1.3"/>
    <path d="M-75 -36h150" stroke="#667866"/><path d="M-63 -44h24" stroke="#b8bc9e" stroke-width="2" stroke-linecap="round"/>
    <g class="row" stroke-linecap="round">
      <path d="M-59 7h117 M-59 29h117" stroke="#637c69" stroke-width="1"/>
      <path d="M-50 2h56m-56 22h40" stroke="#a3b19a" stroke-width="2.6"/>
      <circle cx="51" cy="2" r="2" fill="#98ae95"/><circle cx="51" cy="24" r="2" fill="#98ae95"/>
    </g>
    <g class="priority">
      <rect x="-65" y="-29" width="130" height="20" rx="2" fill="#dbccab" stroke="#e9dec2"/>
      <path d="M-55 -19h55m6 0h12" fill="none" stroke="#556353" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 -19l3 3 6 -7" fill="none" stroke="#50634f" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
  </g>
  <g fill="#e7ca8b" stroke="#253a30" stroke-width="1.4">
    <g class="input" opacity="0"><rect x="-7" y="-3.8" width="14" height="7.6" rx="3.8"/></g>
    <g class="output" opacity="0"><rect x="-7" y="-3.8" width="14" height="7.6" rx="3.8"/></g>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle" fill="#e9e6d6">
    <text x="170" y="187">Gmail</text><text x="466" y="187">Ollama</text><text x="768" y="187">Notion</text>
  </g>
</svg>
